name: Hybrid Job

on:
  workflow_dispatch:

jobs:
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in ubuntu VM
        run: echo "Running in ubuntu VM"

      - name: Run a command in Alpine container
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'Running in Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "Back to ubuntu VM"

  dockerized_job:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Run a command in Node.js container
        run: echo "Running in Node.js container"
      - name: node --version
        run: node --version
