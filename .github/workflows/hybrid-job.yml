name: Hybrid Job

on:
  workflow_dispatch:

jobs:
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in ubuntu VM
        run: echo "Running in ubuntu VM"

      - name: Run a command in Alpine container
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: echo "Running in Alpine container"
